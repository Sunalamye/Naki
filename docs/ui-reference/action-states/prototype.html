.keycard-head span:last-child{margin-left:auto;color:#5fe17e;font-weight:600;display:flex;align-items:center;gap:5px}

body.ios{min-width:0}
body.ios .canvas{width:852px;height:393px;grid-template-rows:44px 1fr 26px;border-radius:24px}
body.ios .lights{display:none}
body.ios .toolbar{padding:0 12px;gap:7px}
body.ios .brand{font-size:16px;margin:0 6px 0 2px}
body.ios .segments{border-radius:7px}body.ios .seg{padding:5px 11px;font-size:12px}
body.ios .chip{padding:5px 8px;font-size:11px;border-radius:7px}
body.ios .icon{width:28px;height:28px;font-size:16px}
body.ios .main{grid-template-columns:1fr}
body.ios .game-placeholder strong{font-size:15px}body.ios .game-placeholder span{font-size:11px}
/* 側欄改成浮在 WebView 上的 HUD：iPhone 橫向只有 393pt 高，
   桌面那種切掉一塊寬度的做法會把牌桌壓扁。 */
body.ios .sidebar{position:absolute;right:9px;top:52px;width:190px;
 max-height:calc(100% - 90px);background:#10151bf2;backdrop-filter:blur(14px);
 border:1px solid #313b47;border-radius:13px;padding:9px 10px;overflow-y:auto;
 box-shadow:0 10px 30px #0009}
body.ios .side-title{font-size:13px;font-weight:700;margin-bottom:7px}
body.ios .side-title .state{font-size:10px;gap:5px}
body.ios .summary{height:26px;font-size:11px;border-radius:7px;justify-content:space-evenly}
body.ios .section-label{font-size:10px;margin:9px 0 5px}
body.ios .decision{min-height:0;padding:9px;border-radius:8px}
body.ios .decision-top{gap:8px}
body.ios .tile{width:34px;height:45px}
body.ios .tile.small{width:26px;height:35px}
body.ios .tile.tiny{width:20px;height:27px}
body.ios .tile.called{margin:0 4px;top:4px}
body.ios .tile.stacked{transform:translate(-30px,-16px) rotate(90deg);margin-right:-30px}
body.ios .meld{min-height:0;gap:4px}body.ios .meld.terminals{gap:2px;margin-top:8px}
body.ios .action{font-size:12px;padding:3px 7px;border-radius:5px}
body.ios .prob{font-size:19px}
body.ios .detail{font-size:10px;margin:7px 0 6px}
body.ios .bar{height:5px}
body.ios .option{height:34px;padding:5px 7px;gap:7px;border-radius:6px}
body.ios .rank{width:16px;font-size:10px}
body.ios .option .mini-action{font-size:10px;padding:2px 5px}
body.ios .option .pct{font-size:10px}body.ios .mini-bar{width:34px;height:4px}
body.ios .options{gap:5px}
/* iPhone 橫向放不下三個次選（實測溢出 31px，第三個被 HUD 底邊切掉）。
   截斷比裁切誠實：畫面說得出「還有幾個沒顯示」，裁切只是看起來壞掉。 */
body.ios .options .option:nth-child(n+3){display:none}
body.ios .options::after{content:attr(data-more);display:block;text-align:center;
 color:#79848f;font-size:10px;padding-top:2px}
body.ios .statusbar{padding:0 12px;font-size:10px}
body.ios .status-icon{width:16px;height:16px;font-size:9px;border-width:1px;margin-right:7px}
body.ios .status-count{padding:3px 7px;font-size:10px;border-radius:5px}
body.ios .empty{min-height:0;padding:18px 0}body.ios .empty-icon{font-size:28px;margin-bottom:7px}
body.ios .empty h2{font-size:13px}body.ios .empty p{font-size:10px}
body.ios .spinner{width:22px;height:22px;border-width:3px;margin-bottom:9px}
body.ios .error-banner{font-size:10px;padding:8px 9px;border-radius:7px;margin-bottom:9px}
/* 詳細資訊在 iPhone 上不夠高展開成面板，改用整頁 sheet 的形狀 */
body.ios .sidebar.expanded{left:9px;right:9px;width:auto;bottom:30px;max-height:none}
body.ios .sidebar.expanded .info-grid{grid-template-columns:repeat(4,1fr)}
body.ios .sidebar.expanded .summary{justify-content:space-around}
body.ios .details-panel{padding:8px 10px}
body.ios .info-grid{grid-template-columns:1fr;gap:3px}
body.ios .info-pair{font-size:11px}
body.ios .score{padding:3px;font-size:10px}
body.ios .badge{font-size:10px;padding:3px 5px}
body.ios .info-title{font-size:10px;margin-bottom:6px}
body.ios .details-head{font-size:11px;margin-bottom:6px}
body.ios .info-row .tile{width:20px;height:27px}
body.ios .settings-sheet{width:812px;max-height:373px}
body.ios .settings-layer{padding:12px}
body.ios .settings-title{height:44px;padding:0 14px;font-size:15px}
body.ios .settings-body{padding:10px;gap:10px;grid-template-columns:260px 1fr;
 max-height:325px;overflow-y:auto}
body.ios .settings-card{padding:9px}body.ios .settings-card h3{font-size:12px;margin-bottom:7px}
body.ios .settings-card p{font-size:10px}body.ios .setting-row{font-size:11px;min-height:28px}
body.ios .settings-input{padding:6px 8px;font-size:11px}
body.ios .field-label{font-size:10px;margin:7px 0 3px}
body.ios .settings-button{padding:5px 8px;font-size:11px}
body.ios .effective{font-size:10px;padding:7px 8px}
body.ios .server-address{font-size:10px}
</style>
</head>
<body>
<div class="canvas" id="main-content">
  <header class="toolbar">
    <div class="lights"><i class="light red"></i><i class="light yellow"></i><i class="light green"></i></div>
    <div class="brand">Naki</div>
    <div class="segments"><div class="seg">關</div><div class="seg active">推薦</div><div class="seg">自動</div></div>
    <div class="chip">1.0 秒⌃⌄</div><div class="chip"><i class="dot"></i>MCP 8765</div><div class="chip"><i class="dot"></i>已連接</div>
    <div class="toolbar-spacer"></div><div class="icon">↻</div><button class="icon" onclick="render('settings')" aria-label="開啟設定">⚙</button><div class="icon">⌁</div><div class="icon">▣</div>
  </header>
  <main class="main">
    <section class="game" id="game"></section>
    <aside class="sidebar" id="sidebar"></aside>
  </main>
  <footer class="statusbar" id="statusbar"></footer>
  <div class="settings-layer" id="settingsLayer"></div>
</div>
<div class="prototype" aria-label="狀態切換面板">
  <div class="state-buttons" id="stateButtons"></div>
  <div class="exports">
    <button class="export-btn" id="deviceBtn" onclick="toggleDevice()">切換 iPhone</button>
    <button class="export-btn" onclick="copyState(this)">複製狀態 JSON</button>
    <button class="export-btn" onclick="downloadHTML()">下載 HTML</button>
  </div>
</div>

const HONORS={E:'東',S:'南',W:'西',N:'北',P:'白',F:'發',C:'中'};
const SUITS={m:'萬',p:'筒',s:'索'};
const NUMERALS=['零','一','二','三','四','五','六','七','八','九'];

// 兩邊講不同名字的話，wireframe 就不能拿來核對 VoiceOver 文案。
function tileLabel(code){
 if(code==='back')return '牌背';if(code==='blank')return '空白牌';if(code==='front')return '牌面';
 if(HONORS[code])return HONORS[code];
 const red=code.endsWith('r'),body=red?code.slice(0,-1):code;
 const n=+body[0],suit=SUITS[body[1]];
 if(!suit||!Number.isInteger(n))return code;
 return (red?'紅':'')+NUMERALS[n]+suit;
}

// 手寫清單與 `scripts/build-tile-sprite.py` 產出的內容遲早會漂開。
const TILE_CODES=new Set([...document.querySelectorAll('#tile-sprite symbol')].map(s=>s.id.slice(2)));

//
// 舊版是手繪 SVG：數字＋「萬」、圓圈陣列、箭頭狀索子。那與 App 實際顯示的牌不是
// 同一套圖，所以 wireframe 回答不了「這個尺寸看不看得清」——而那正是這份參考檔
// 唯一要回答的問題。手繪版也畫不出赤五。
// 這套資產把「牌身」與「牌面圖案」拆成兩個檔案：`Front.svg` 是米白色的牌，
// `Man5.svg` 之類只有圖案本身、背景透明。只畫圖案的話，深色側欄會直接透出來，
// 看起來是一堆浮空的花紋而不是牌。`back`／`blank`／`front` 自己就是完整的牌，不疊。
const SELF_CONTAINED=new Set(['back','blank','front']);

function emptyTileSVG(cls,label){

}

function detailsPanel(s,summaryRow){
 const cloud=s.sanma;const actions=cloud?['打','拔北','和']:s.action==='立直'?['打','立直']:s.action.startsWith('吃')?['吃','碰','過']:s.action==='碰'?['碰','過']:s.action.includes('槓')?['槓','過']:s.action==='自摸'||s.action==='榮和'?['和']:['打','立直'];
 return `<details class="disclosure" ${s.infoOpen?'open':''}><summary class="summary">${summaryRow}</summary><div class="details-panel"><div class="details-head"><span>詳細狀態</span><span>● 資料正常</span></div><div class="info-section"><div class="info-title">牌局</div><div class="info-grid"><div class="info-pair"><span>局況</span><b>東 1 局・0 本場</b></div><div class="info-pair"><span>供託</span><b>0 本</b></div><div class="info-pair"><span>我的座位</span><b>Player 0・東家</b></div><div class="info-pair"><span>規則</span><b>${cloud?'三人麻將':'四人麻將'}</b></div></div><div class="scores"><div class="score me">東（我）<br>25,000</div><div class="score">南<br>25,000</div><div class="score">西<br>25,000</div><div class="score">北<br>${cloud?'—':'25,000'}</div></div><div class="info-row"><span>寶牌指示牌</span>${tileSVG('3p','tile tiny')}</div></div><div class="info-section"><div class="info-title">模型與資料來源</div><div class="info-grid"><div class="info-pair"><span>模型</span><b>${cloud?'Cloud 3P':'Mortal 4P'}</b></div><div class="info-pair"><span>決策來源</span><b>${cloud?'cloud:3p-model':'local'}</b></div><div class="info-pair"><span>推論位置</span><b>${cloud?'設定中的雲端主機':'本機 Core ML'}</b></div><div class="info-pair"><span>雲端狀態</span><b>${cloud?'已連線':'未啟用'}</b></div></div></div><div class="info-section"><div class="info-title">伺服器目前授權動作</div><div class="badges">${['打','立直','吃','碰','槓','和',...(cloud?['拔北']:[])].map(a=>`<span class="badge ${actions.includes(a)?'on':''}" aria-label="${a}・${actions.includes(a)?'可用':'不可用'}">${a} ${actions.includes(a)?'✓':'✕'}</span>`).join('')}</div></div></div></details>`
}
function settingsHTML(){return `<section class="settings-sheet" role="dialog" aria-label="進階設定"><header class="settings-title"><span>進階設定</span><small>變更會自動儲存</small><button class="settings-button primary" onclick="render('discard')">完成</button></header><div class="settings-body"><div class="settings-column"><section class="settings-card"><h3>◉ 畫面</h3><div class="setting-row"><span>隱藏玩家名稱</span><label class="toggle right"><input type="checkbox"><i></i></label></div><p>新對局開始後，把暱稱改寫為 Player 1–4；重連與終局畫面仍可能顯示原名。</p></section><section class="settings-card"><h3>◷ 自動操作</h3><div class="setting-row"><span>自動送出</span><b class="right">可用</b></div><div class="setting-row"><span>基準延遲</span><div class="right settings-actions"><button class="settings-button compact" onclick="adjustDelay(-.1)">−</button><b id="delayValue">1.0 秒</b><button class="settings-button compact" onclick="adjustDelay(.1)">＋</button></div></div><p>合法範圍 0.5–3.0 秒；實際動作仍會套用隨機延遲。</p></section><section class="settings-card"><h3>◫ Bot 管理</h3><p>Bot 在遊戲開始時自動建立，通常不需要手動管理。</p><div class="settings-actions"><button class="settings-button" onclick="settingMessage('Bot 重建請求已送出')">重建 Bot</button><button class="settings-button danger" onclick="settingMessage('Bot 已刪除')">刪除 Bot</button></div></section><section class="settings-card"><h3>▤ MCP Server</h3><div class="setting-row"><span><i class="dot"></i> <b id="mcpState">運行中</b></span><button id="mcpButton" class="settings-button danger right" onclick="toggleMCP()">停止</button></div><div class="server-address">http://localhost:8765</div><p>curl http://localhost:8765/logs</p></section></div><div class="settings-column"><section class="settings-card"><h3>☁ 雲端推論</h3><div class="setting-row"><span>啟用雲端推論</span><label class="toggle right"><input id="cloudEnabled" type="checkbox" checked onchange="updateCloudState()"><i></i></label></div><p class="privacy-note">每個決策點會上傳本局事件與自家手牌。API Key 儲存在 Keychain，不寫入 log 或設定檔；失敗時四麻退回本地模型。</p><label class="field-label" for="serverURL">伺服器 URL</label><input class="settings-input" id="serverURL" value="https://mjapi.shinkuan.me"><label class="field-label" for="apiKey">API Key</label><input class="settings-input" id="apiKey" type="password" value="naki-reference-key"><label class="field-label" for="model4p">四麻模型</label><div class="field-wrap"><input class="settings-input" id="model4p" value="4p-akg-v8"><button class="settings-button" aria-label="選擇四麻模型">⌄</button></div><label class="field-label" for="model3p">三麻模型</label><div class="field-wrap"><input class="settings-input" id="model3p" value="3p-akg-v1"><button class="settings-button" aria-label="選擇三麻模型">⌄</button></div><div class="settings-actions" style="margin-top:12px"><button id="testCloud" class="settings-button" onclick="testCloud()">測試連線</button><span id="cloudTestResult" class="settings-message">伺服器正常・模型清單已載入</span></div><div class="effective" id="cloudEffective">✓ 雲端推論已生效——對局中會以雲端決策為準</div><section class="keycard"><div class="keycard-head"><span>◷ 金鑰狀態</span><span><i class="dot"></i>使用中</span></div><div class="keyrow"><span>方案</span><b>pro</b></div><div class="keyrow"><span>到期時間</span><b>2026-08-23 01:22:47</b></div><div class="keyrow"><span>剩餘</span><b>19 天</b></div><div class="keyrow"><span>今日用量</span><b>1683 / 6000</b></div><div class="usagebar"><i></i></div><div class="keyrow" style="margin-top:6px"><span>限額</span><b>10 次/分・top-5</b></div><p style="margin-top:8px">填好 API Key 後自動查詢（<code>GET /v3/key</code>），不必手動按測試連線。</p></section><p>三麻 3P 模型是目前唯一的真三麻推論路徑；雲端未生效時不提供三麻推薦。</p></section><div id="settingsMessage" class="settings-message"></div></div></div></section>`}
let delayValue=1,mcpRunning=true;
function adjustDelay(delta){delayValue=Math.min(3,Math.max(.5,Math.round((delayValue+delta)*10)/10));document.getElementById('delayValue').textContent=delayValue.toFixed(1)+' 秒'}
function settingMessage(message){const el=document.getElementById('settingsMessage');el.textContent='✓ '+message}
function toggleMCP(){mcpRunning=!mcpRunning;document.getElementById('mcpState').textContent=mcpRunning?'運行中':'已停止';const b=document.getElementById('mcpButton');b.textContent=mcpRunning?'停止':'啟動';b.classList.toggle('danger',mcpRunning)}
function updateCloudState(){const on=document.getElementById('cloudEnabled').checked;const e=document.getElementById('cloudEffective');e.textContent=on?'✓ 雲端推論已生效——對局中會以雲端決策為準':'! 雲端推論尚未生效，仍使用內建本地模型';e.style.borderColor=on?'#2f7441':'#8a652d';e.style.color=on?'#5fe17e':'#f2b64a'}
function testCloud(){const b=document.getElementById('testCloud'),r=document.getElementById('cloudTestResult');b.textContent='測試中…';r.textContent='';setTimeout(()=>{b.textContent='測試連線';r.textContent='伺服器正常・模型清單已載入'},500)}
let currentKey='discard',device='mac';
function toggleDevice(){device=device==='mac'?'ios':'mac';applyDevice();render(currentKey)}
function applyDevice(){document.body.classList.toggle('ios',device==='ios');
 const b=document.getElementById('deviceBtn');if(b)b.textContent=device==='ios'?'切換 macOS':'切換 iPhone'}
function render(key){const selected=states[key]||states.discard;const isSettings=selected.screen==='settings';const s=isSettings?states.discard:selected;currentKey=key;document.querySelectorAll('.seg').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.seg')[s.mode==='off'?0:1].classList.add('active');document.getElementById('game').innerHTML=gameSVG();let model=s.sanma?'Cloud 3P':'Mortal 4P';let html=`<div class="side-title">即時決策 <span class="state"><i class="dot"></i>${s.empty?'待機':'運行中'}</span></div>`;
 if(s.empty==='error')html+=`<div class="error-banner">JavaScript 注入失敗：Naki 讀不到牌局，也送不出任何動作</div>`;
 const summaryRow=device==='ios'
  ?`<b>東 1 局</b><span>自風 東</span>`
  :`<b>東 1 局</b><span>自風 東</span><span>25,000</span><span>${model}</span>`;
 if(s.empty)html+=`<div class="summary">${summaryRow}</div>`;
 if(s.empty){const data=s.empty==='waiting'?['◌','等待遊戲數據…','Naki 會在收到牌局資料後顯示推薦']:s.empty==='off'?['⊘','推薦顯示已關閉','切換到「推薦」或「自動」可恢復']:['!','系統功能已阻斷','請重新建置或重新安裝 App'];html+=`<div class="empty"><div><div class="empty-icon">${data[0]}</div>${s.empty==='waiting'?'<div class="spinner"></div>':''}<h2>${data[1]}</h2><p>${data[2]}</p></div></div>`}else html+=detailsPanel(s,summaryRow)+decisionCard(s)+(s.infoOpen?'':options(s));
 const sb=document.getElementById('sidebar');sb.className='sidebar'+(s.infoOpen?' expanded':'');sb.innerHTML=html;document.getElementById('statusbar').innerHTML=`<span class="status-icon">${s.empty==='error'?'!':s.empty==='waiting'?'i':'✓'}</span><span>${selected.status||s.status}</span>${s.count?`<span class="status-count">${s.count} 個選項</span>`:''}`;document.getElementById('settingsLayer').innerHTML=isSettings?settingsHTML():'';document.querySelectorAll('.state-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.state===key));history.replaceState(null,'',`?state=${key}${device==='ios'?'&device=ios':''}${document.body.classList.contains('capture')?'&capture=1':''}`)}
const stateButtons=document.getElementById('stateButtons');Object.entries(states).forEach(([k,v])=>{const btn=document.createElement('button');btn.className='state-btn';btn.dataset.state=k;btn.textContent=v.label;btn.onclick=()=>render(k);stateButtons.appendChild(btn)});
const params=new URLSearchParams(location.search);if(params.get('capture')==='1')document.body.classList.add('capture');
device=params.get('device')==='ios'?'ios':'mac';applyDevice();
render(params.get('state')||'discard');
function copyState(btn){const key=currentKey;navigator.clipboard.writeText(JSON.stringify({key,...states[key]},null,2)).then(()=>{btn.textContent='✓ 已複製';setTimeout(()=>btn.textContent='複製狀態 JSON',1500)})}
function downloadHTML(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>'+document.documentElement.outerHTML],{type:'text/html'}));a.download='naki-action-state-reference.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
</script>
</body>
</html>
